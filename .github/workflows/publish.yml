name: Publish Quarto slides

on:
  push:
    branches-ignore:
      - 'main'
      - 'slides-base'
      - 'gh-pages'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render slides
        run: quarto render --output-dir _site --output index.html

      - name: Check output
        run: ls -la && find . -maxdepth 2 -type d

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          target-folder: ${{ github.ref_name }}
